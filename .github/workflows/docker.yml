name: Docker

on:
  push:
    branches: [main]
    paths:
      - '**/*.zig'
      - 'build.zig.zon'
      - 'interop/Dockerfile'
  workflow_dispatch:

jobs:
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: interop/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/zquic-interop:latest
