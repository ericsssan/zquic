name: Interop

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Docker]
    types: [completed]

jobs:
  interop:
    name: quic-interop-runner
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    # Only run if Docker workflow succeeded (or triggered manually).
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install Docker Engine 28.1+
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl
          sudo install -m 0755 -d /etc/apt/keyrings
          sudo curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
          sudo chmod a+r /etc/apt/keyrings/docker.asc
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | sudo tee /etc/apt/sources.list.d/docker.list
          sudo apt-get update
          sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
          docker --version

      - name: Install system dependencies
        run: |
          sudo apt-get install -y tshark jq python3-pip

      - name: Clone quic-interop-runner
        run: git clone --depth 1 https://github.com/quic-interop/quic-interop-runner runner

      - name: Install Python dependencies
        run: pip3 install -r runner/requirements.txt

      - name: Pull zquic image
        run: docker pull ghcr.io/${{ github.repository_owner }}/zquic:latest

      - name: Run interop tests (zquic server × all clients)
        run: |
          cd runner
          python3 run.py \
            --server zquic \
            --test handshake,transfer,retry,keyupdate,v2 \
            --log-dir logs \
            --json results.json \
            -r zquic=ghcr.io/${{ github.repository_owner }}/zquic:latest \
            || true   # runner exits non-zero on any failure; we check below

      - name: Check results
        run: |
          cd runner
          echo "=== Results ==="
          jq -r '.results | flatten | .[] | "\(.name): \(.result)"' results.json

          failures=$(jq -c '.results | flatten | .[] | select(.result == "failed")' results.json)
          if [ -n "$failures" ]; then
            echo "::error::Interop failures detected:"
            echo "$failures"
            exit 1
          fi
          echo "All interop tests passed."

      - name: Update README with results table
        if: always() && hashFiles('runner/results.json') != ''
        run: |
          python3 << 'PYEOF'
          import json, re

          with open('runner/results.json') as f:
              data = json.load(f)

          servers = data.get('servers', [])
          clients = data.get('clients', [])
          results_data = data.get('results', [])

          # Collect all test names across all pairs
          tests_set = set()
          for s_results in results_data:
              for c_results in s_results:
                  for r in c_results:
                      tests_set.add(r['name'])
          tests = sorted(tests_set)

          zquic_idx = servers.index('zquic') if 'zquic' in servers else 0

          # Build markdown table
          header = '| Test | ' + ' | '.join(clients) + ' |'
          divider = '| --- |' + ' :---: |' * len(clients)
          rows = []
          for test in tests:
              row = f'| {test} |'
              for c_idx in range(len(clients)):
                  symbol = '—'
                  try:
                      for tr in results_data[zquic_idx][c_idx]:
                          if tr['name'] == test:
                              symbol = '✅' if tr['result'] == 'succeeded' else '❌'
                              break
                  except (IndexError, KeyError):
                      pass
                  row += f' {symbol} |'
              rows.append(row)

          table = '\n'.join([header, divider] + rows)

          with open('README.md') as f:
              readme = f.read()

          new_section = f'<!-- INTEROP_START -->\n{table}\n<!-- INTEROP_END -->'
          updated = re.sub(
              r'<!-- INTEROP_START -->.*?<!-- INTEROP_END -->',
              new_section,
              readme,
              flags=re.DOTALL,
          )

          with open('README.md', 'w') as f:
              f.write(updated)

          print(f"Updated README: {len(tests)} tests × {len(clients)} clients")
          PYEOF

      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "Update interop results [skip ci]"
          git push

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interop-logs
          path: runner/logs/
          retention-days: 7
