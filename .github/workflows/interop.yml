name: Interop

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Docker]
    types: [completed]

jobs:
  interop:
    name: quic-interop-runner
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    # Only run if Docker workflow succeeded (or triggered manually).
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install Docker Engine 28.1+
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl
          sudo install -m 0755 -d /etc/apt/keyrings
          sudo curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
          sudo chmod a+r /etc/apt/keyrings/docker.asc
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | sudo tee /etc/apt/sources.list.d/docker.list
          sudo apt-get update
          sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
          docker --version

      - name: Install system dependencies
        run: |
          sudo apt-get install -y tshark jq python3-pip

      - name: Clone quic-interop-runner
        run: git clone --depth 1 https://github.com/quic-interop/quic-interop-runner runner

      - name: Install Python dependencies
        run: pip3 install -r runner/requirements.txt

      - name: Add zquic to implementations
        run: |
          cd runner
          jq '. + {"zquic": {"image": "ghcr.io/${{ github.repository_owner }}/zquic-interop:latest", "url": "https://github.com/${{ github.repository }}", "role": "server"}}' implementations_quic.json > implementations_quic.json.tmp
          mv implementations_quic.json.tmp implementations_quic.json

      - name: Pull zquic image
        run: docker pull ghcr.io/${{ github.repository_owner }}/zquic-interop:latest

      - name: Run interop tests (zquic server × all clients)
        id: interop
        continue-on-error: true
        run: |
          cd runner
          python3 run.py \
            --server zquic \
            --log-dir logs \
            --json results.json \
            -r zquic=ghcr.io/${{ github.repository_owner }}/zquic-interop:latest \
            || true

      - name: Check results
        if: always()
        run: |
          cd runner
          [ -f results.json ] || { echo "No results file found"; exit 0; }

          # Print to log
          jq -r '.results | flatten | .[] | "\(.name): \(.result)"' results.json 2>/dev/null || true

          # Build summary table
          python3 - results.json >> "$GITHUB_STEP_SUMMARY" << 'PYEOF'
          import json, sys

          with open(sys.argv[1]) as f:
              data = json.load(f)

          servers = data.get("servers", [])
          clients = data.get("clients", [])
          results = data.get("results", [])
          if not servers or not clients or not results:
              sys.exit(0)

          zquic_idx = servers.index("zquic") if "zquic" in servers else None
          if zquic_idx is None:
              sys.exit(0)

          # Collect tests
          tests = set()
          for s in results:
              if isinstance(s, list):
                  for c in s:
                      if isinstance(c, list):
                          for r in c:
                              if isinstance(r, dict) and "name" in r:
                                  tests.add(r["name"])
          tests = sorted(tests)
          if not tests:
              sys.exit(0)

          symbols = {"succeeded": "pass", "failed": "FAIL", "unsupported": "n/a"}

          print("## Interop Results")
          print()
          print(f"| Test | {' | '.join(clients)} |")
          print(f"| --- |{' :---: |' * len(clients)}")
          for test in tests:
              row = f"| {test} |"
              for c_idx in range(len(clients)):
                  sym = "—"
                  try:
                      for tr in results[zquic_idx][c_idx]:
                          if isinstance(tr, dict) and tr.get("name") == test:
                              sym = symbols.get(tr["result"], tr["result"])
                              break
                  except (IndexError, KeyError, TypeError):
                      pass
                  row += f" {sym} |"
              print(row)
          PYEOF

      - name: Update README with results table
        if: always() && hashFiles('runner/results.json') != ''
        run: |
          python3 << 'PYEOF'
          import json, re

          try:
              with open('runner/results.json') as f:
                  data = json.load(f)

              # Handle both flat and nested results formats
              if isinstance(data, dict):
                  servers = data.get('servers', [])
                  clients = data.get('clients', [])
                  results_data = data.get('results', [])
              else:
                  print("Warning: results.json has unexpected format, skipping README update")
                  exit(0)

              if not servers or not clients or not results_data:
                  print("Warning: incomplete results data, skipping README update")
                  exit(0)

              # Collect all test names - handle various result structures
              tests_set = set()
              try:
                  for s_results in results_data:
                      if isinstance(s_results, list):
                          for c_results in s_results:
                              if isinstance(c_results, list):
                                  for r in c_results:
                                      if isinstance(r, dict) and 'name' in r:
                                          tests_set.add(r['name'])
              except (TypeError, KeyError) as e:
                  print(f"Warning: could not parse results structure: {e}, skipping table generation")
                  exit(0)

              if not tests_set:
                  print("No test results found, skipping README update")
                  exit(0)

              tests = sorted(tests_set)
              zquic_idx = servers.index('zquic') if 'zquic' in servers else None

              if zquic_idx is None:
                  print("Warning: zquic not found in servers, skipping README update")
                  exit(0)

              # Build markdown table
              header = '| Test | ' + ' | '.join(clients) + ' |'
              divider = '| --- |' + ' :---: |' * len(clients)
              rows = []
              for test in tests:
                  row = f'| {test} |'
                  for c_idx in range(len(clients)):
                      symbol = '—'
                      try:
                          if zquic_idx < len(results_data) and c_idx < len(results_data[zquic_idx]):
                              for tr in results_data[zquic_idx][c_idx]:
                                  if isinstance(tr, dict) and tr.get('name') == test:
                                      symbol = '✅' if tr.get('result') == 'succeeded' else '❌'
                                      break
                      except (IndexError, KeyError, TypeError):
                          pass
                      row += f' {symbol} |'
                  rows.append(row)

              table = '\n'.join([header, divider] + rows)

              with open('README.md') as f:
                  readme = f.read()

              new_section = f'<!-- INTEROP_START -->\n{table}\n<!-- INTEROP_END -->'
              updated = re.sub(
                  r'<!-- INTEROP_START -->.*?<!-- INTEROP_END -->',
                  new_section,
                  readme,
                  flags=re.DOTALL,
              )

              with open('README.md', 'w') as f:
                  f.write(updated)

              print(f"Updated README: {len(tests)} tests × {len(clients)} clients")
          except Exception as e:
              print(f"Error updating README: {e}")
              exit(0)
          PYEOF

      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          # Nothing changed → don't push at all. Pushing a now-stale local main
          # (e.g. after merges to main) is rejected non-fast-forward and fails the
          # job for no reason — which is exactly what happened during a merge flurry.
          if git diff --cached --quiet; then
            echo "interop results unchanged — nothing to commit"
            exit 0
          fi
          git commit -m "Update interop results [skip ci]"
          # main can move underneath us (concurrent interop runs, or merges) →
          # non-fast-forward push. Rebase onto the latest main and retry.
          for attempt in 1 2 3; do
            git fetch origin main \
              && git rebase origin/main \
              && git push origin HEAD:main \
              && exit 0
            echo "push attempt $attempt failed (main moved); rebasing and retrying"
            git rebase --abort 2>/dev/null || true
            sleep 3
          done
          echo "::error::failed to push interop results after 3 attempts"
          exit 1

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interop-logs
          path: runner/logs/
          retention-days: 7

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interop-results
          path: runner/results.json
          retention-days: 30
