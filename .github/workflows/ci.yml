name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: 0.17.0-dev.657+2faf8debf

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, ubuntu-24.04-arm]

    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Check formatting
        run: zig fmt --check src/ tools/

      - name: Build library + server
        run: zig build

      - name: Test (Debug)
        run: zig build test --summary all

      - name: Test (ReleaseSafe)
        run: zig build test -Doptimize=ReleaseSafe --summary all

  cross-compile:
    name: Cross-compile (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-linux-musl, riscv64-linux-musl]

    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Cross-compile
        run: zig build -Dtarget=${{ matrix.target }}

  oracle:
    name: Oracle (interop vs reference impls)
    runs-on: ubuntu-latest
    env:
      QUICHE_REF: "0.29.2"   # pinned for reproducible CI builds
      NGTCP2_REF: "v1.9.0"   # pinned; build-refs.sh uses GnuTLS on Linux (#29)
      NGHTTP3_REF: "v1.7.0"  # noble ships 0.8.0; ngtcp2 v1.9.0 requires >=1.0.0
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Ensure cmake (for quiche / BoringSSL)
        run: cmake --version || { sudo apt-get update && sudo apt-get install -y cmake; }

      # Raise the kernel cap on UDP socket buffers so the server's 8 MiB
      # SO_RCVBUF/SO_SNDBUF requests take effect (default rmem_max ~208 KiB).
      # Extra receive headroom lets the server absorb ACK bursts without drops
      # when it is briefly starved of CPU under the loaded oracle matrix, which
      # is a contributor to the seeded-loss recovery stalls.
      - name: Raise UDP socket buffer limits
        run: sudo sysctl -w net.core.rmem_max=8388608 net.core.wmem_max=8388608

      # build-refs.sh looks for quiche at the repo's sibling (../quiche). Resolve
      # that to a clean absolute path (no "..") so it's cacheable.
      - name: Resolve quiche path
        run: echo "QUICHE_DIR=$(cd "$GITHUB_WORKSPACE/.." && pwd)/quiche" >> "$GITHUB_ENV"

      - name: Resolve ngtcp2 path
        run: echo "NGTCP2_DIR=$(cd "$GITHUB_WORKSPACE/.." && pwd)/ngtcp2" >> "$GITHUB_ENV"

      - name: Build zquic (server + client)
        run: zig build

      # quiche is the GREASE-frame regression guard (#4), a VN trigger, and a 2nd
      # independent HTTP/0.9 oracle — none of which gate main without it (#6).
      - name: Clone quiche (pinned)
        run: git clone --depth 1 --branch "$QUICHE_REF" --recursive https://github.com/cloudflare/quiche.git "$QUICHE_DIR"

      - name: Cache cargo + quiche build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.QUICHE_DIR }}/target
          key: quiche-${{ runner.os }}-${{ env.QUICHE_REF }}

      # ngtcp2 exercises the H3/QPACK path (IMPL_TC[ngtcp2]=http3). Built with
      # GnuTLS on Linux (GnuTLS 3.7+ has the QUIC transport API; Ubuntu's OpenSSL
      # 3.0 does not). The clone + cache mirror the quiche pattern above (#29, #31).
      - name: Install ngtcp2 deps (GnuTLS + libev)
        run: sudo apt-get update -qq && sudo apt-get install -y libgnutls28-dev libev-dev

      # noble (ubuntu-24.04) ships libnghttp3 0.8.0 but ngtcp2 v1.9.0 requires
      # >=1.0.0. Build from source; cmake's CMAKE_SYSTEM_PREFIX_PATH searches
      # /usr/local before /usr so find_path(nghttp3/nghttp3.h) picks up the 1.7.0
      # header over the apt-installed 0.8.0 one. libnghttp3-dev is not apt-installed
      # so pkg_check_modules returns no HINTS, letting find_path fall back to the
      # standard prefix search order.
      - name: Build + install nghttp3 from source
        run: |
          git clone --depth 1 --branch "$NGHTTP3_REF" --recurse-submodules \
            https://github.com/ngtcp2/nghttp3.git /tmp/nghttp3
          cmake -S /tmp/nghttp3 -B /tmp/nghttp3/build \
            -DCMAKE_BUILD_TYPE=Release -DENABLE_LIB_ONLY=ON
          cmake --build /tmp/nghttp3/build -j$(nproc)
          sudo cmake --install /tmp/nghttp3/build
          sudo ldconfig

      - name: Clone ngtcp2 (pinned)
        run: git clone --depth 1 --branch "$NGTCP2_REF" --recurse-submodules https://github.com/ngtcp2/ngtcp2.git "$NGTCP2_DIR"

      - name: Cache ngtcp2 build
        uses: actions/cache@v4
        with:
          path: ${{ env.NGTCP2_DIR }}/build
          key: ngtcp2-${{ runner.os }}-${{ env.NGTCP2_REF }}

      - name: Build reference impls + fixtures
        run: bash oracle/build-refs.sh

      # val/all-fixes: Linux stability validation of all 3 fixes combined
      # (ACK >31-range + STREAM_DATA_BLOCKED throttle + sub-1MB loss file).
      - name: Validate seeded-loss stability (all fixes)
        run: |
          echo "nproc=$(nproc)"
          for t in "quiche transferloss 80" "ngtcp2 transferloss 40" "quiche transfercorruption 40"; do
            set -- $t
            echo "--- $1 $2 x$3 ---"
            ORACLE_REPEAT="$3" bash oracle/run.sh -i "$1" "$2" 2>&1 | grep -oE "STABILITY: [0-9]+/[0-9]+" | sed "s|^|[$1 $2] |"
          done
